<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QHSEFlow V6 — Prototype</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#09233f,#17608e);color:#fff;padding:24px 0}.wrap{max-width:1350px;margin:auto;padding:0 20px}.top h1{margin:0 0 5px}.nav{display:flex;gap:7px;flex-wrap:wrap;background:#fff;padding:12px;margin:18px 0;border-radius:15px;box-shadow:0 3px 15px #0001;position:sticky;top:8px;z-index:10}.btn{border:0;border-radius:9px;padding:10px 13px;background:#1f5f8f;color:#fff;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn.red{background:#b42318}.btn.green{background:#087443}.btn.gray{background:#667085}.btn.light{background:#e8eef5;color:#172033}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:15px 0}.card{background:#fff;padding:18px;border-radius:15px;box-shadow:0 2px 12px #0001}.kpi{font-size:30px;font-weight:800}.muted{color:#667085}.danger{color:#b42318}.warn{color:#b54708}.success{color:#087443}.section{display:none}.section.active{display:block}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}.full{grid-column:1/-1}.form input,.form select,.form textarea,.search{width:100%;padding:11px;border:1px solid #cdd6e0;border-radius:9px;background:#fff}.form textarea{min-height:95px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8eef5;font-size:12px}.crit{background:#ffd9d9;color:#a40000}.high{background:#ffe8c2;color:#8a4b00}.mod{background:#fff4cc;color:#705700}.low{background:#dcfce7;color:#166534}.actions{display:flex;gap:6px;flex-wrap:wrap}.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.photo-grid img{width:105px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:520px}.cell{padding:13px;text-align:center;border-radius:5px;font-weight:bold;background:#e9eef4}.c1{background:#dcfce7}.c2{background:#fff4cc}.c3{background:#ffe8c2}.c4{background:#ffd9d9}.login{max-width:450px;margin:80px auto}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:50}.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:#667085}.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.step{padding:9px 11px;border-radius:10px;background:#edf3f8}.arrow{color:#667085}.notice{border-left:4px solid #1f5f8f;padding:10px;background:#f4f8fb;margin:8px 0}.preview{max-height:100px}.hidden{display:none}@media(max-width:650px){.wrap{padding:0 12px}.nav{position:static}.table th,.table td{white-space:nowrap}.hero{align-items:flex-start}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const S={data:null,user:null,view:'dashboard',editing:null};const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,opt);let d;try{d=await r.json()}catch{d=await r.text()}if(!r.ok)throw Error(d.error||d);return d}async function refresh(){S.data=await api('/api/data');render()}function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function loginPage(){return `<div class="login card"><h1>QHSEFlow</h1><p class="muted">Plateforme QHSE orientée terrain et gain de temps.</p><input id="email" class="search" value="admin@qhse.local"><input id="pass" type="password" class="search" value="admin123"><button class="btn" onclick="login()">🔐 Se connecter</button><p class="small muted">Compte démo : admin@qhse.local / admin123</p></div>`}async function login(){try{S.user=(await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('pass').value})})).user;render()}catch(e){alert(e.message)}}
function nav(){const items=[['dashboard','🏠 Dashboard'],['incidents','🚨 Incidents'],['risks','⚠️ Risques'],['actions','✅ Actions'],['inspections','🔎 Inspections'],['audits','📋 Audits'],['environment','♻️ Environnement'],['users','👥 Utilisateurs'],['journal','📜 Journal']];return `<div class="nav">${items.map(([v,t])=>`<button class="btn light" onclick="go('${v}')">${t}</button>`).join('')}<button class="btn" onclick="S.user=null;render()">Déconnexion</button></div>`}
function dash(){const d=S.data, overdue=d.actions.filter(a=>a.status!=='Clôturée'&&a.dueDate&&new Date(a.dueDate)<new Date()).length, crit=d.risks.filter(r=>r.level==='Critique').length, closed=d.actions.filter(a=>a.status==='Clôturée').length, rate=d.actions.length?Math.round(closed/d.actions.length*100):0;return `<section class="section active"><div class="hero"><div><h2>Tableau de bord</h2><p class="muted">Vue instantanée des priorités QHSE.</p></div><button class="btn" onclick="runChecks()">⚡ Contrôler les alertes</button></div><div class="grid"><div class="card"><span class="muted">Incidents</span><div class="kpi">${d.incidents.length}</div></div><div class="card"><span class="muted">Risques critiques</span><div class="kpi danger">${crit}</div></div><div class="card"><span class="muted">Actions en retard</span><div class="kpi warn">${overdue}</div></div><div class="card"><span class="muted">Taux de clôture</span><div class="kpi success">${rate}%</div></div></div><div class="card"><h3>Workflow QHSE</h3><div class="flow"><span class="step">🔎 Inspection</span><span class="arrow">→</span><span class="step">⚠️ Constat / risque</span><span class="arrow">→</span><span class="step">✅ Action</span><span class="arrow">→</span><span class="step">🔔 Notification</span><span class="arrow">→</span><span class="step">📸 Preuve</span><span class="arrow">→</span><span class="step">📄 Rapport</span></div></div><div class="grid"><div class="card"><h3>Priorités</h3>${d.risks.filter(r=>['Critique','Élevé'].includes(r.level)).slice(0,6).map(r=>`<div class="notice">⚠️ <b>${esc(r.activity)}</b> — ${esc(r.danger)} <span class="badge ${r.level==='Critique'?'crit':'high'}">${r.level}</span></div>`).join('')||'<div class="empty">Aucune priorité.</div>'}</div><div class="card"><h3>Notifications</h3>${d.notifications.slice(0,7).map(n=>`<div class="notice">🔔 ${esc(n.message)}</div>`).join('')||'<div class="empty">Aucune notification.</div>'}</div></div></section>`}
const defs={incidents:{title:'Incidents',fields:[['type','Type','text'],['date','Date','date'],['site','Site','text'],['description','Description','textarea'],['severity','Gravité','select:Faible|Moyenne|Élevée|Critique']]},risks:{title:'Risques',fields:[['activity','Activité','text'],['danger','Danger','text'],['probability','Probabilité 1-5','number'],['gravity','Gravité 1-5','number'],['measures','Mesures de maîtrise','textarea']]},actions:{title:'Actions correctives',fields:[['title','Titre','text'],['description','Description','textarea'],['responsible','Responsable','text'],['dueDate','Échéance','date'],['priority','Priorité','select:Basse|Moyenne|Haute|Critique'],['status','Statut','select:Ouverte|En cours|Clôturée']]},inspections:{title:'Inspections',fields:[['site','Site','text'],['date','Date','date'],['zone','Zone','text'],['observation','Observation / constat','textarea'],['riskLevel','Niveau de risque','select:Faible|Moyenne|Élevé|Critique'],['responsible','Responsable action','text'],['dueDate','Échéance action','date']]},audits:{title:'Audits',fields:[['reference','Référence','text'],['standard','Référentiel','select:ISO 9001|ISO 14001|ISO 45001|HACCP'],['date','Date','date'],['finding','Constat / écart','textarea'],['responsible','Responsable','text'],['dueDate','Échéance','date']]},environment:{title:'Environnement',fields:[['date','Date','date'],['indicator','Indicateur','select:Déchets|Eau|Énergie|Émissions|Effluents'],['value','Valeur','number'],['unit','Unité','text'],['site','Site','text']]}};
function form(name){const e=S.editing;return `<div class="card" id="editor"><h3>${e?'✏️ Modifier':'➕ Nouvel'} élément</h3><div class="form">${defs[name].fields.map(f=>{let val=e?e[f[0]]:'';if(f[2].startsWith('select:'))return `<div><label>${f[1]}</label><select id="f_${f[0]}">${f[2].slice(7).split('|').map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;return `<div class="${f[2]==='textarea'?'full':''}"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea id="f_${f[0]}">${esc(val)}</textarea>`:`<input id="f_${f[0]}" type="${f[2]}" value="${esc(val)}" ${f[2]==='number'?'min="1" max="5"':''}>`}</div>`}).join('')}<div class="full"><label>📸 Photos / preuves</label><input id="photos" type="file" accept="image/*" multiple onchange="previewPhotos()"><div id="preview" class="photo-grid"></div></div><div class="full actions"><button class="btn green" onclick="saveItem('${name}')">💾 Enregistrer</button><button class="btn gray" onclick="S.editing=null;go('${name}')">Annuler</button></div></div></div>`}
function previewPhotos(){const files=[...$('photos').files];$('preview').innerHTML=files.map(f=>`<img class="preview" src="${URL.createObjectURL(f)}">`).join('')}
async function uploadPhotos(){
  const input=$("photos");
  const files=input?.files||[];
  if(!files.length) return [];
  const fd=new FormData();
  [...files].forEach(f=>fd.append("photos",f));
  const r=await fetch("/api/upload",{method:"POST",body:fd});
  let d;
  try{d=await r.json()}catch(e){throw new Error("Réponse serveur invalide pendant l’upload")}
  if(!r.ok) throw new Error(d.error||"Erreur pendant l’upload");
  return d.files||[];
}
async async function saveItem(name){try{const body={};defs[name].fields.forEach(f=>body[f[0]]=$('f_'+f[0]).value);if(name==='risks'){body.probability=Number(body.probability);body.gravity=Number(body.gravity)}const photos=await uploadPhotos();if(photos.length)body.photos=photos;if(S.editing)await api('/api/'+name+'/'+S.editing.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});else await api('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});S.editing=null;toast('Enregistré');await refresh()}catch(e){alert(e.message)}}
function showForm(name){
  S.editing=null;
  const section=document.querySelector('.section.active');
  if(!section){console.error('Section active introuvable');return;}
  const old=document.getElementById('editor');
  if(old) old.remove();
  section.insertAdjacentHTML('beforeend',form(name));
  const editor=document.getElementById('editor');
  if(editor) editor.scrollIntoView({behavior:'smooth',block:'start'});
}
function table(name){const rows=S.data[name]||[];return `<section class="section active"><div class="hero"><div><h2>${defs[name].title}</h2><p class="muted">Ajout, modification, suppression, recherche et export.</p></div><div class="actions"><button class="btn" onclick="showForm('${name}')">➕ Ajouter</button><a class="btn" href="/api/export/${name}">📊 Excel/CSV</a></div></div><input class="search" placeholder="🔍 Rechercher dans les données..." oninput="filterRows(this,'${name}')"><div class="tablewrap"><table class="table"><thead><tr>${defs[name].fields.map(f=>`<th>${f[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="rows_${name}">${rows.map(r=>row(name,r)).join('')||'<tr><td colspan="20" class="empty">Aucune donnée.</td></tr>'}</tbody></table></div></section>`}
function row(name,r){const extra=name==='inspections'?`<button class="btn" onclick="makeAction(${r.id})">⚡ Action</button>`:'';const report=`<a class="btn light" target="_blank" href="/api/report/${name}/${r.id}">📄</a>`;return `<tr data-text="${esc(JSON.stringify(r))}">${defs[name].fields.map(f=>`<td>${esc(r[f[0]])}${f[0]==='level'?` <span class="badge">${esc(r.level)}</span>`:''}</td>`).join('')}<td><div class="actions"><button class="btn" onclick='editItem("${name}",${r.id})'>✏️</button><button class="btn red" onclick='delItem("${name}",${r.id})'>🗑️</button>${report}${extra}</div>${r.photos?.length?`<div class="photo-grid">${r.photos.map(p=>`<a href="${p.url}" target="_blank"><img src="${p.url}"></a>`).join('')}</div>`:''}${name==='actions'&&r.status!=='Clôturée'?`<button class="btn green" style="margin-top:6px" onclick="closeAction(${r.id})">✓ Clôturer</button>`:''}</td></tr>`}
function filterRows(inp,name){const q=inp.value.toLowerCase();document.querySelectorAll('#rows_'+name+' tr').forEach(tr=>tr.style.display=tr.dataset.text?.toLowerCase().includes(q)?'':'none')}
function editItem(name,id){S.editing=S.data[name].find(x=>x.id===id);document.querySelector('.section.active').insertAdjacentHTML('beforeend',form(name));$('editor').scrollIntoView({behavior:'smooth'})}async async function delItem(name,id){if(!confirm('Supprimer définitivement cet élément ?'))return;try{await api('/api/'+name+'/'+id,{method:'DELETE'});toast('Supprimé');refresh()}catch(e){alert(e.message)}}
async function makeAction(id){const i=S.data.inspections.find(x=>x.id===id);if(!i)return;try{await api('/api/inspections/'+id+'/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({responsible:i.responsible,dueDate:i.dueDate,priority:i.riskLevel,title:'Action corrective — Inspection #'+id,description:i.observation})});toast('Action corrective créée automatiquement');refresh()}catch(e){alert(e.message)}}async function closeAction(id){if(!confirm('Clôturer cette action ?'))return;await api('/api/actions/'+id+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});toast('Action clôturée');refresh()}async function runChecks(){toast('Contrôle des alertes effectué');refresh()}
function users(){return `<section class="section active"><h2>Utilisateurs</h2><div class="card"><div class="form"><input id="un" placeholder="Nom"><input id="ue" placeholder="Email"><input id="up" type="password" placeholder="Mot de passe"><select id="ur"><option>Admin</option><option>QHSE Manager</option><option>Superviseur</option><option>Employé</option></select><button class="btn" onclick="addUser()">Créer</button></div></div><div class="card tablewrap"><table class="table"><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Action</th></tr>${S.data.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.id!==1?`<button class="btn red" onclick="delUser(${u.id})">🗑️</button>`:'Compte principal protégé'}</td></tr>`).join('')}</table></div></section>`}async function addUser(){try{await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('un').value,email:$('ue').value,password:$('up').value,role:$('ur').value})});toast('Utilisateur créé');refresh()}catch(e){alert(e.message)}}async function delUser(id){if(confirm('Supprimer ?')){await api('/api/users/'+id,{method:'DELETE'});refresh()}}
function journal(){return `<section class="section active"><h2>Journal</h2><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr>${S.data.logs.map(x=>`<tr><td>${new Date(x.date).toLocaleString('fr-FR')}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</table></div></section>`}
function go(v){S.view=v;S.editing=null;render()}function render(){if(!S.user){$('app').innerHTML=loginPage();return}let c=S.view==='dashboard'?dash():S.view==='users'?users():S.view==='journal'?journal():table(S.view);$('app').innerHTML=`<div class="top"><div class="wrap"><h1>QHSEFlow V6 — Prototype</h1><div>${esc(S.user.name)} — ${esc(S.user.role)}</div></div></div><div class="wrap">${nav()}${c}</div>`}refresh().catch(()=>{S.data={users:[],incidents:[],risks:[],actions:[],inspections:[],audits:[],environment:[],logs:[],notifications:[]};render()});
</script></body></html>
